services:
  db:
    image: postgres:16
    container_name: castlewatch-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: castlewatch
      POSTGRES_USER: castlewatch
      POSTGRES_PASSWORD: castlewatch_dev_password

    ports:
      - "15432:5432"

    volumes:
      - castlewatch_postgres:/var/lib/postgresql/data

volumes:
  castlewatch_postgres: