services:
  db:
    image: postgres:16
    container_name: castlewatch-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "15432:5432"

    volumes:
      - castlewatch_postgres:/var/lib/postgresql/data

volumes:
  castlewatch_postgres: